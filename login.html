<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA Login</title>

<link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<div class="login-wrap">

    <div class="login-card">

        <div class="logo login-logo">
            <div class="logo-box">A</div>
            <span>AURA</span>
        </div>

        <h1>Log in</h1>
        <p>Sign in to manage or review game assets.</p>

        <label>Username</label>
        <input id="loginUsername" type="text" placeholder="e.g. artist" autocomplete="username">

        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password">

        <p class="login-error" id="loginError"></p>

        <button class="submit login-submit" onclick="login()">Log In</button>

        <div class="login-demo">

            <p><b>Demo accounts</b></p>

            <div class="login-demo-row">
                <div>
                    <b>Artist</b> — uploads assets
                    <br><code>artist / artist123</code>
                </div>
                <button type="button" onclick="fillLogin('artist','artist123')">Use</button>
            </div>

            <div class="login-demo-row">
                <div>
                    <b>Admin</b> — reviews assets
                    <br><code>admin / admin123</code>
                </div>
                <button type="button" onclick="fillLogin('admin','admin123')">Use</button>
            </div>

        </div>

    </div>

</div>

<script src="script.js?v=4"></script>

</body>
</html>
